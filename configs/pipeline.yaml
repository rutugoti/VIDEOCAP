# Pipeline execution configuration
sampling:
  method: "adaptive"  # uniform | adaptive | scene_change | hybrid
  fps: 1.0           # frames per second
  max_frames: 30
  min_frames: 5
  baseline_fps: 1.0
  min_scene_duration: 1.0
  motion_threshold: 15.0
  scene_change_threshold: 20.0
  silence_threshold: -40.0 # dB
  adaptive_sampling_limits:
    max_samples: 30
    min_samples: 5

perception:
  parallel: true
  timeout_seconds: 180
  max_workers: 3
  vision:
    enabled: true
  speech:
    enabled: true
  ocr:
    enabled: true

fusion:
  min_confidence: 0.3
  temporal_window_seconds: 2.0

graph:
  causal_edges: false
  causal_window_seconds: 4.0
  edge_weight_threshold: 0.3
  max_edges_to_narrative: 20

narrative:
  max_events: 10
  max_words: 100
  consume_edges: true

generation:
  styles:
    - formal
    - sarcastic
    - tech_humor
    - non_tech_humor
  max_caption_words: 35
  min_caption_words: 10
  single_pass: true
  style_separation_min: 0.5

evidence_policy:
  escalate_conflict_min_conf: 0.7

validation:
  enabled: true
  hallucination_check: true
  style_leakage_check: true
  fact_drift_check: true
  retry_on_failure: true
  max_retries: 2
  unsupported_claim_check: false  # P4.1 (Nice-to-Have): entailment check, off by default
