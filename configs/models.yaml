# Model provider configuration
# Providers can be a single string (e.g. "gemini") or a fallback list (e.g. ["gemini", "fireworks", "mock"])
vision:
  provider: ["gemini", "fireworks", "mock"]
  model: "gemini-2.5-flash"  # Will fall back to fireworks or mock if gemini API key is not set
  max_tokens: 4096
  temperature: 0.2

speech:
  provider: ["fireworks", "openai", "mock"]
  model: "whisper-v3"
  language: "en"

ocr:
  provider: ["gemini", "fireworks", "mock"]
  model: "gemini-2.5-flash"
  max_tokens: 1024

llm:
  provider: ["gemini", "fireworks", "mock"]
  model: "gemini-2.5-flash"
  max_tokens: 512
  temperature: 0.7

validator:
  provider: ["gemini", "fireworks", "mock"]
  model: "gemini-2.5-flash"
  max_tokens: 1024
  temperature: 0.1

