# Model provider configuration
vision:
  provider: "fireworks"
  model: "accounts/fireworks/models/gemma-4-31b-it"  # Updated to Gemma Multimodal VLM
  max_tokens: 4096
  temperature: 0.2

speech:
  provider: "fireworks"
  model: "whisper-v3"
  language: "en"

ocr:
  provider: "fireworks"
  model: "accounts/fireworks/models/gemma-4-31b-it"  # Updated to Gemma Multimodal VLM
  max_tokens: 1024

llm:
  provider: "fireworks"
  model: "accounts/fireworks/models/gemma-3-27b-it"  # Updated to Gemma Text Reasoning LLM
  max_tokens: 512
  temperature: 0.7

validator:
  provider: "fireworks"
  model: "accounts/fireworks/models/gemma-3-27b-it"  # Updated to Gemma Text Reasoning LLM
  max_tokens: 1024
  temperature: 0.1
