# Model provider configuration
# Providers can be a single string (e.g. "groq") or a fallback list (e.g. ["groq", "fireworks"]).
# There is no offline mock: if none of the listed providers has a usable API key,
# the pipeline fails loudly rather than emitting fabricated captions.
vision:
  provider: ["fireworks", "groq"]
  model: "accounts/fireworks/models/minimax-m3"  # Deployed Fireworks vision model
  max_tokens: 4096
  temperature: 0.2

speech:
  provider: ["fireworks", "groq"]
  model: "whisper-large-v3"
  language: "en"

ocr:
  provider: ["fireworks", "groq"]
  model: "accounts/fireworks/models/qwen3p7-plus"
  max_tokens: 1024

llm:
  provider: ["fireworks", "groq"]
  model: "accounts/fireworks/models/llama-v3p1-70b-instruct"
  max_tokens: 512
  temperature: 0.7

validator:
  provider: ["fireworks", "groq"]
  model: "accounts/fireworks/models/llama-v3p1-70b-instruct"
  max_tokens: 1024
  temperature: 0.1

